services:
  mcp-server:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    ports:
      - "9090:9090"
      - "9080:9080"
    environment:
      GODOT_MCP_TRANSPORT: http
      GODOT_MCP_HTTP_HOST: "0.0.0.0"
      GODOT_MCP_HTTP_PORT: "9090"
      # The server binds the bridge port inside the container so the host editor
      # can connect in (bridge inversion, #276). Binding 0.0.0.0 relaxes the
      # localhost-only default — only do this on a trusted host (#226).
      GODOT_MCP_BRIDGE_URL: ws://0.0.0.0:9080
      # Required when binding off-loopback (0.0.0.0): set a bearer token or the
      # server refuses to start. Clients pass it as `auth=<token>` (#226).
      # GODOT_MCP_AUTH_TOKEN: set-me
      # Optional: point at a project directory mounted from the host.
      # GODOT_MCP_PROJECT_DIR: /project
    # volumes:
    #   - /path/to/your/godot/project:/project:ro
    healthcheck:
      # Use the same socket-based probe as the Dockerfile so no extra tooling is needed.
      test: >
        ["CMD", "python", "-c",
        "import socket; s=socket.socket(); s.connect(('localhost', 9090)); s.close()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
