# CI gates — kept in sync with .claude/rules/enforcement.md.
# Suite health (zero skips) · lint (ruff) · type check (mypy) · tests (pytest).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: server (lint · types · tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Zero-skip scan (suite health)
        run: ./.claude/hooks/check-no-skipped-tests.sh

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy

      - name: Tests (pytest)
        run: uv run pytest -q
