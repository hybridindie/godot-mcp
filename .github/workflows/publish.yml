name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (e.g. 2026.08.26b1)"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write  # upload-artifact
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build package
        run: uv build

      - name: Build Godot addon zip
        run: |
          # Create a zip containing only the addons/godot_mcp/ directory,
          # structured so it extracts into the project root (addons/godot_mcp/...).
          # This is the format Godot's Asset Library and manual install expect.
          # Built into a separate directory (addon_dist/) so it is NOT uploaded to
          # PyPI — pypa/gh-action-pypi-publish uploads everything in its packages
          # dir, and the addon zip is not a Python distribution.
          mkdir -p addon_dist
          cd godot
          zip -r ../addon_dist/godot_mcp_addon.zip addons/godot_mcp/

      - name: Upload Python dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload Godot addon zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: addon_dist
          path: addon_dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing (OIDC — no API token needed).
      actions: read   # download-artifact
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Stable releases go to PyPI as-is; if a prerelease (b1, rc1) is ever
          # cut again, pip install --pre picks those up — PyPI accepts
          # prerelease versions natively.
          skip-existing: true

  publish-github:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Attach artifacts to the GitHub release.
      actions: read   # download-artifact
    steps:
      - name: Download Python dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Download Godot addon zip
        uses: actions/download-artifact@v4
        with:
          name: addon_dist
          path: addon_dist/

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            addon_dist/godot_mcp_addon.zip
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}

  publish-assetlib:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read  # download-artifact
    steps:
      - name: Download Godot addon zip
        uses: actions/download-artifact@v4
        with:
          name: addon_dist
          path: addon_dist/

      - name: Publish to Godot Asset Library
        env:
          ASSETLIB_TOKEN: ${{ secrets.GODOT_ASSETLIB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -z "$ASSETLIB_TOKEN" ]; then
            echo "GODOT_ASSETLIB_TOKEN not set — skipping Asset Library publish"
            exit 0
          fi
          # Submit the addon zip to the Godot Asset Library API.
          # https://godotengine.org/asset-library/api
          # The asset must be pre-registered at https://godotengine.org/asset-library
          # with edit access for this token.
          VERSION="$TAG"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/godot_mcp_addon.zip"
          curl -s -X POST "https://godotengine.org/asset-library/api/asset/edit" \
            -H "Authorization: Bearer $ASSETLIB_TOKEN" \
            -F "asset_id=YOUR_ASSET_ID" \
            -F "version=$VERSION" \
            -F "download_url=$DOWNLOAD_URL" \
            -F "browse_url=https://github.com/${{ github.repository }}" \
            -F "icon_url=https://raw.githubusercontent.com/${{ github.repository }}/main/godot/addons/godot_mcp/icon.png" \
            -F "category=2" \
            -F "godot_version=4.4"

  publish-docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # Push to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          # Docker tag: lowercase repo, strip dots from version for a clean tag
          # e.g. 2026.08.26b1 → 2026.08.26b1 (kept as-is, Docker accepts it)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max