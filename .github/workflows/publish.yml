name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (e.g. 2026.08.26b1)"
        required: true

permissions:
  contents: read

# Publishing builds exactly the tagged commit (`inputs.tag` on a manual dispatch,
# else the release's `github.ref`) and only after the checks pass (#649). A
# missing tag fails at checkout. Third-party actions are SHA-pinned; Dependabot
# (.github/dependabot.yml) keeps them fresh.
jobs:
  test:
    # Release gate: never publish a commit whose tests / lint / types fail.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1  # v8.3.1
        with:
          version: "0.11.29"

      - name: Zero-skip scan (suite health)
        run: ./.opencode/hooks/check-no-skipped-tests.sh

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy

      - name: Tests (pytest)
        run: uv run pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write  # upload-artifact
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1  # v8.3.1
        with:
          # Pinned (issue #579) — skips the flaky manifest fetch (see ci.yml).
          version: "0.11.29"

      - name: Build package
        run: uv build

      - name: Build Godot addon zip
        run: |
          # Create a zip containing only the addons/godot_mcp/ directory,
          # structured so it extracts into the project root (addons/godot_mcp/...).
          # This is the format Godot's Asset Library and manual install expect.
          # Built into a separate directory (addon_dist/) so it is NOT uploaded to
          # PyPI — pypa/gh-action-pypi-publish uploads everything in its packages
          # dir, and the addon zip is not a Python distribution.
          mkdir -p addon_dist
          cd godot
          zip -r ../addon_dist/godot_mcp_addon.zip addons/godot_mcp/

      - name: Upload Python dist artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/

      - name: Upload Godot addon zip artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: addon_dist
          path: addon_dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing (OIDC — no API token needed).
      actions: read   # download-artifact
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          # Stable releases go to PyPI as-is; if a prerelease (b1, rc1) is ever
          # cut again, pip install --pre picks those up — PyPI accepts
          # prerelease versions natively.
          skip-existing: true

  publish-github:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Attach artifacts to the GitHub release.
      actions: read   # download-artifact
    steps:
      - name: Download Python dist artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/

      - name: Download Godot addon zip
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: addon_dist
          path: addon_dist/

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            addon_dist/godot_mcp_addon.zip
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}

  publish-assetlib:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read  # download-artifact
    steps:
      - name: Download Godot addon zip
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: addon_dist
          path: addon_dist/

      - name: Publish to Godot Asset Library
        env:
          ASSETLIB_TOKEN: ${{ secrets.GODOT_ASSETLIB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -z "$ASSETLIB_TOKEN" ]; then
            echo "GODOT_ASSETLIB_TOKEN not set — skipping Asset Library publish"
            exit 0
          fi
          # Submit the addon zip to the Godot Asset Library API.
          # https://godotengine.org/asset-library/api
          # The asset must be pre-registered at https://godotengine.org/asset-library
          # with edit access for this token.
          VERSION="$TAG"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/godot_mcp_addon.zip"
          curl -s -X POST "https://godotengine.org/asset-library/api/asset/edit" \
            -H "Authorization: Bearer $ASSETLIB_TOKEN" \
            -F "asset_id=YOUR_ASSET_ID" \
            -F "version=$VERSION" \
            -F "download_url=$DOWNLOAD_URL" \
            -F "browse_url=https://github.com/${{ github.repository }}" \
            -F "icon_url=https://raw.githubusercontent.com/${{ github.repository }}/main/godot/addons/godot_mcp/icon.png" \
            -F "category=2" \
            -F "godot_version=4.4"

  publish-docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # Push to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # The image must be built from the tagged commit, not the default branch.
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          # Docker tag: lowercase repo, strip dots from version for a clean tag
          # e.g. 2026.08.26b1 → 2026.08.26b1 (kept as-is, Docker accepts it)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          file: infra/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
