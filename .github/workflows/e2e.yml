# Live-editor end-to-end suites — the coverage the `ci` job can't provide (it runs
# on the self-hosted runner but without a Godot editor). The e2e
# (`test_*_e2e.py`) and addon-smoke (`test_addon_*.py`) tests are gated
# `skipif(GODOT_BIN is None)`, so in `ci` they silently skip.
# This job runs them on a SELF-HOSTED runner that has a Godot editor binary —
# closing the CI gap behind #263/#269.
#
# TRIGGER POLICY (2026-10-20): the e2e is TOO HEAVY for routine CI — a live
# editor boot per run contends for the single self-hosted runner (issue #444's
# flake source) and multiplies runner minutes. The job runs ONLY when:
#   - manually dispatched (workflow_dispatch below),
#   - nightly on main (the `schedule` below), or
#   - a PR touches something that can change live-editor behavior:
#       * the addon itself (`godot/addons/godot_mcp/**`) and its smoke scripts
#         (`godot/tests/**`) or project config (`godot/project.godot`),
#       * the server/tools contract that drives the bridge (`mcp_server/**`),
#       * the Python deps the server runs on (`pyproject.toml`, `uv.lock`), or
#       * this workflow.
# Python `tests/**`-only changes do NOT trigger it: they change the verification,
# not the addon. Use workflow_dispatch on the branch (or the nightly run) for
# test-only changes; the addon floor is separately checked on every PR by the
# `godot-floor` job in ci.yml (Godot 4.4 parse + headless smokes). The vendored
# consumers like world_forge pin by commit and do NOT inherit e2e runs.
# Everything else is verified locally: run `workflow_dispatch` on the branch
# (or `uv run pytest tests/integration/test_*_e2e.py` on a dev machine with
# GODOT_BIN set) before merging changes that don't match the paths filter.
#
# HISTORY: this job was `if:`-guarded off 2026-09-17 → 2026-09-30 after the
# runner's outbound network failed (checkout/setup-uv/`uv sync` timeouts; root
# cause was a LAN-level ARP conflict on 192.168.0.0/24, diagnosed in #581).
# Pinning the Godot runner to the `fedora` GPU node (#598) resolved it; a
# `workflow_dispatch` on `main` went green end-to-end on 2026-10-01. #581 is
# closed. The remaining `if:` on the job is NOT a disable — it is the
# fork-PR protection for the self-hosted runner (see SECURITY below).
#
# RUNNER REQUIREMENTS (k3s self-hosted, label `godot`):
#   - Godot 4.7 *editor* binary (not the export-template/server build — the suites
#     need `--editor`). The editor runs headless via `--headless` (dummy audio), but
#     the *play-session* suites need a display: `xvfb-run` provides a virtual one
#     (#672), without which those tests skip.
#   - `xvfb` installed (provides `xvfb-run`) — required for play-session e2e (#672).
#   - Python 3.11+ and uv available (or installed by the steps below).
#   - The binary path is `$GODOT_BIN` — set the `GODOT_BIN` repo/org Actions
#     variable, or bake it at the default path below in the runner image.
# The eval workflow uses the same self-hosted convention (label `godot-eval`); a
# single runner can carry both labels if it has Godot installed.
#
# 4.8 BETA LANE (#739): a second, ADVISORY job runs the same suites against the
# pinned Godot 4.8-beta1 binary (`/opt/godot48/godot`, baked by the runner image;
# a SHA512-verified download is the fallback until that image rolls out). It
# shares the trigger policy above (dispatch + the addon/server paths filter) and
# is `continue-on-error`: a beta regression is visible but does not block — the
# 4.7 lane remains the stable gate. The known upstream MeshLibrary regression
# (godotengine/godot#124712) is asserted as the expected beta1 shape, not a
# blanket skip, so the rest of the suite still runs.
#
# SECURITY (public repo): a self-hosted runner must never execute untrusted fork
# code. The job below is guarded so only same-repo branch PRs and manual dispatch
# run on the runner — fork PRs skip it. Also set the repo Actions setting "Require
# approval for all outside collaborators" and prefer an ephemeral runner (fresh pod
# per job) so a run can't persist state or reach the co-located `godot-eval`
# runner's credentials.
name: e2e

on:
  workflow_dispatch:
  # #651: nightly on main so merges that only touch tests/docs still get a live run.
  schedule:
    - cron: "0 6 * * *"
  pull_request:
    paths:
      - "godot/addons/godot_mcp/**"
      - "godot/tests/**"
      - "godot/project.godot"
      - "mcp_server/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/e2e.yml"

# One in-flight live-editor run across the whole repo (issue #444): the single
# self-hosted runner is shared, and two concurrent PRs' jobs contend for the
# editor, `godot/.godot/`, and the bridge port — the documented flake source.
# Superseded pushes within a ref still cancel in place.
concurrency:
  group: e2e
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  editor-suites:
    name: live editor (e2e + addon smoke)
    runs-on: [self-hosted, godot]
    # SECURITY (public repo + self-hosted runner): never execute untrusted fork code
    # on the runner. Only same-repo branch PRs and manual dispatch run; fork PRs skip
    # this job (it reports as skipped, non-blocking). Defense-in-depth on top of the
    # repo setting "Require approval for all outside collaborators"; prefer an
    # ephemeral runner so each run starts from a clean pod.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    env:
      # Provided by the runner image, or override with the GODOT_BIN repo variable.
      GODOT_BIN: ${{ vars.GODOT_BIN || '/opt/godot/godot' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          # Pinned (issue #579) — skips the flaky manifest fetch (see ci.yml).
          version: "0.11.29"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Verify Godot version (pinned to 4.7)
        # The suites are validated against the version the godot/ project declares
        # (config/features=PackedStringArray("4.7")). Fail fast if the runner drifts.
        run: |
          ver="$("$GODOT_BIN" --version)"
          echo "Godot: $ver"
          case "$ver" in
            4.7*) ;;
            *) echo "::error::expected Godot 4.7.x on the runner, got '$ver'"; exit 1 ;;
          esac

      - name: Warm asset import
        # Populate .godot/ once so the editor doesn't import on first launch mid-test
        # (the suites' connect-retry covers a cold start, but this removes the flake).
        # Best-effort: unrelated import warnings must not fail the run.
        run: 'timeout 180 "$GODOT_BIN" --headless --import --path godot/ || true'

      - name: Editor e2e + addon smoke suites
        # The two globs match exactly the editor-dependent integration tests
        # (everything gated on GODOT_BIN / using run_godot); new e2e files are
        # picked up automatically. -p no:cacheprovider keeps the runner workspace clean.
        # #672: run under a virtual display (xvfb) so the *play-session* tests —
        # gated on $DISPLAY via _has_display — actually execute instead of silently
        # skipping (the coverage gap this closes). Fail loudly if the runner lacks
        # xvfb rather than falling back to a silent skip.
        # `timeout --kill-after` bounds the suite (15 min, under the 20-min job
        # cap): a hung bridge call inside one e2e test must not wedge the whole
        # job — and SIGKILL after the TERM grace reaps the editor child that a
        # hard-killed pytest would otherwise leave running (issue #581: a hung
        # run kept multiple godot instances open on the runner).
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            echo "::error::xvfb-run not found on the runner; the play-session e2e would silently skip. Install xvfb (issue #672)."
            exit 1
          fi
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            timeout --signal=TERM --kill-after=10 900 \
            uv run pytest -q -p no:cacheprovider \
            tests/integration \
            tests/contract/test_addon_guards.py \
            tests/contract/test_addon_handshake.py \
            tests/contract/test_router_refactor.py \
            tests/contract/test_undo_threshold.py

      - name: Reap stray Godot processes
        # Defense-in-depth for the hang mode above: a job that dies at its cap
        # (or is cancelled mid-suite) can leave editor/game children alive on the
        # shared runner; the next job then contends with them (the #444 flake
        # source, and the wedge observed in issue #581's verification runs).
        if: always()
        run: |
          pkill -f 'godot.*--editor' 2>/dev/null || true
          pkill -f 'godot.*remote-debug' 2>/dev/null || true
          sleep 1
          if pgrep -f 'godot.*(remote-debug|--editor)' >/dev/null; then
            echo "::warning::stray godot processes survived the reaping"
          fi

  godot-4-8-beta:
    name: live editor (Godot 4.8 beta, advisory)
    runs-on: [self-hosted, godot]
    # SECURITY: same fork-PR protection as the 4.7 lane (see the header).
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # Beta verification is advisory (#739): a red check is visible, but only the
    # 4.7 lane gates a stable release. Remove continue-on-error at 4.8-stable.
    continue-on-error: true
    timeout-minutes: 20
    env:
      # Baked at /opt/godot48 by infra/runner.Dockerfile; override with a repo var.
      GODOT_BIN: ${{ vars.GODOT48_BIN || '/opt/godot48/godot' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.29"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Resolve Godot 4.8 beta (baked, else verified download)
        # Pinned to beta commit 4d10419ca (4.8.beta1.official). Betas have no
        # GitHub release checksum file, so the SHA512 below is the pinned hash of
        # the official downloads.godotengine.org zip. Update both together.
        run: |
          set -euo pipefail
          if [ -x "$GODOT_BIN" ]; then
            "$GODOT_BIN" --version
            exit 0
          fi
          version=4.8-beta1
          asset="Godot_v${version}_linux.x86_64.zip"
          sha512="aee4cbf3c5f86eee875c0f2f77cc9d816a3fbb220774e6ffc95fd5a557a6c5ec917f2b6118c0aa2008bd10f4b2a021225dc78ba7b7c54745411e0f2721f70a67"
          dir="$RUNNER_TEMP/godot48"
          mkdir -p "$dir"
          cd "$dir"
          if [ ! -x godot ]; then
            curl -fsSL -o "$asset" \
              "https://downloads.godotengine.org/?version=4.8&flavor=beta1&slug=linux.x86_64.zip"
            echo "${sha512}  ${asset}" | sha512sum -c -
            unzip -o -q "$asset"
            chmod +x "Godot_v${version}_linux.x86_64"
            ln -sf "Godot_v${version}_linux.x86_64" godot
          fi
          echo "GODOT_BIN=$dir/godot" >> "$GITHUB_ENV"
          "$dir/godot" --version

      - name: Verify Godot 4.8 beta version
        run: |
          ver="$("$GODOT_BIN" --version)"
          echo "Godot: $ver"
          case "$ver" in
            4.8.beta1*) ;;
            *) echo "::error::expected Godot 4.8-beta1 on the beta lane, got '$ver'"; exit 1 ;;
          esac

      - name: Warm asset import
        run: 'timeout 180 "$GODOT_BIN" --headless --import --path godot/ || true'

      - name: Editor e2e + addon smoke suites (4.8 beta)
        # Same suites as the stable lane. The MeshLibrary assertion is branch-gated
        # on 4.8-beta1 in test_persistence_e2e.py (upstream #124712) — the rest of
        # the suite runs normally.
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            echo "::error::xvfb-run not found on the runner; the play-session e2e would silently skip. Install xvfb (issue #672)."
            exit 1
          fi
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            timeout --signal=TERM --kill-after=10 900 \
            uv run pytest -q -p no:cacheprovider \
            tests/integration \
            tests/contract/test_addon_guards.py \
            tests/contract/test_addon_handshake.py \
            tests/contract/test_router_refactor.py \
            tests/contract/test_undo_threshold.py

      - name: Reap stray Godot processes
        if: always()
        run: |
          pkill -f 'godot.*--editor' 2>/dev/null || true
          pkill -f 'godot.*remote-debug' 2>/dev/null || true
          sleep 1
          if pgrep -f 'godot.*(remote-debug|--editor)' >/dev/null; then
            echo "::warning::stray godot processes survived the reaping"
          fi
