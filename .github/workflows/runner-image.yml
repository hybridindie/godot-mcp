# Build and push the custom Godot-capable GitHub Actions runner image to GHCR.
# The image is used by the `hybridindie-godot-mcp-godot` scale set (4.7-arc; see the tags block)
# the e2e (godot-mcp) and gle-bench (godot-agents) workflows.
#
# Manual dispatch is the primary trigger (rebuild only when the Godot version
# or base runner image bumps). Also runs on changes to the Dockerfile itself.
name: runner-image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "infra/runner.Dockerfile"
      - ".github/workflows/runner-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: hybridindie-godot-mcp-linux
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/hybridindie/godot-mcp-runner
          # `4.7` / `latest` are deliberately NOT published yet: they still point
          # at the summerwind-based image the classic RunnerDeployments run, and
          # the upstream-base image cannot exec under classic ARC (/runner/run.sh
          # is gone). Flip these back to 4.7 + latest once the classic godot pools
          # are deleted and only the scale sets remain.
          tags: |
            type=raw,value=4.7-arc
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: infra/runner.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}