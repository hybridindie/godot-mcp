# Build and push the custom Godot-capable GitHub Actions runner image to GHCR.
# The image is used by the [self-hosted, godot] RunnerDeployment that serves
# the e2e (godot-mcp) and gle-bench (godot-agents) workflows.
#
# Manual dispatch is the primary trigger (rebuild only when the Godot version
# or base runner image bumps). Also runs on changes to the Dockerfile itself.
#
# #706: the godot-mcp-runner GHCR package currently refuses this repo's
# GITHUB_TOKEN (`permission_denied: write_package`). Until the package grants
# hybridindie/godot-mcp write access, push events build-only (so a Dockerfile
# change still validates) and only a manual dispatch pushes.
name: runner-image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "infra/runner.Dockerfile"
      - ".github/workflows/runner-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: [self-hosted, linux, hybridindie]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/hybridindie/godot-mcp-runner
          tags: |
            type=raw,value=4.7
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: infra/runner.Dockerfile
          push: ${{ github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
