[project]
name = "godot-editor-mcp"
version = "2026.08.31b4"
description = "MCP server that drives a live Godot editor for AI-driven game development"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "John Doh", email = "johnd@johndstudios.net" }]
keywords = ["godot", "mcp", "ai", "game-development", "model-context-protocol", "editor-automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    # The MCP framework (PrefectHQ/fastmcp). Pinned to the 4.0 beta (issue #311).
    # 4.0.0b3 picks up the tool-title default (PrefectHQ/fastmcp#4694 — some clients
    # drop tools with no `title`) and HTTP-startup/bug fixes over b1 (issue #353).
    # b1 already shipped the modern-protocol guard pattern (InputRequiredResult,
    # InputRequiredToolResult, Context.input_responses / request_state) needed by
    # the durable-approval work (issue #346) — no upgrade required.
    # 2.x→3.x had breaking API changes (#228); the v3→v4 transition is lower-risk
    # for this server (stateless, no ctx.elicit, no session state, canonical imports
    # already in place). Beta pin per the upgrade guide; follow stable 4.x when it ships.
    "fastmcp[tasks]==4.0.0b3",
    # WebSocket transport for the addon/server bridge (issue #3).
    "websockets>=16.0",
    # Domain models and typed tool I/O (issue #7).
    "pydantic>=2.13",
    "pypng>=0.20",
    # URL download for asset import (issue #108) + approval-webhook POST (issue #153).
    # httpx2 is a drop-in fork of httpx with the same public API; FastMCP 4.0 uses it
    # exclusively, and standardizing here keeps our httpx exception handlers live code
    # (FastMCP raises httpx2 exceptions, so `except httpx.` would silently never match).
    "httpx2>=2.9",
]

[project.urls]
Homepage = "https://github.com/hybridindie/godot-mcp"
Repository = "https://github.com/hybridindie/godot-mcp"
Documentation = "https://github.com/hybridindie/godot-mcp#readme"
Issues = "https://github.com/hybridindie/godot-mcp/issues"
Changelog = "https://github.com/hybridindie/godot-mcp/releases"

[project.scripts]
godot-editor-mcp = "mcp_server.main:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "mypy>=2.1",
    "ruff>=0.15",
    "jsonschema>=4.26.0",
    "types-jsonschema>=4.26.0.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# FastMCP 4.0 beta pinning: fastmcp is a thin wrapper over fastmcp-slim at the
# same version. uv won't infer the slim prerelease from the wrapper prerelease,
# so constrain it alongside (per the upgrade guide). The rest of the graph
# stays on stable releases. The background-tasks spike (#315) adds fastmcp-tasks
# at the same prerelease; fastmcp-slim 4.0.0b3 already depends on the *final*
# mcp-types 2.0.0 / mcp 2.0.0 (not the 2.0.0b2 prerelease the upgrade guide lists —
# that pin is unsatisfiable: slim declares mcp-types>=2.0.0 which excludes b2),
# so only fastmcp-tasks needs the prerelease pin here.
[tool.uv]
constraint-dependencies = ["fastmcp-slim==4.0.0b3", "fastmcp-tasks==4.0.0b3"]

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]

[tool.pytest.ini_options]
# Contract -> Integration -> Unit (see .claude/rules/testing.md).
testpaths = ["tests"]
asyncio_mode = "auto"
# Forbidden skips are a blocking gate; surface them loudly.
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["mcp_server", "tests"]

# pypng (PNG decode for screenshot diffing, issue #37) ships no type stubs.
[[tool.mypy.overrides]]
module = ["png"]
ignore_missing_imports = true
