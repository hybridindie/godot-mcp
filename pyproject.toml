[project]
name = "godot-mcp"
version = "2026.06.01"
description = "MCP server that drives a live Godot editor for AI-driven game development"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    # The MCP framework (PrefectHQ/fastmcp). Pinned to the 4.0 beta (issue #311):
    # 2.x→3.x had breaking API changes (#228); the v3→v4 transition is lower-risk
    # for this server (stateless, no ctx.elicit, no session state, canonical imports
    # already in place). Beta pin per the upgrade guide; follow stable 4.x when it ships.
    "fastmcp==4.0.0b1",
    # WebSocket transport for the addon/server bridge (issue #3).
    "websockets>=16.0",
    # Domain models and typed tool I/O (issue #7).
    "pydantic>=2.13",
    "pypng>=0.20",
    # URL download for asset import (issue #108) + approval-webhook POST (issue #153).
    # httpx2 is a drop-in fork of httpx with the same public API; FastMCP 4.0 uses it
    # exclusively, and standardizing here keeps our httpx exception handlers live code
    # (FastMCP raises httpx2 exceptions, so `except httpx.` would silently never match).
    "httpx2>=2.9",
]

[project.scripts]
godot-mcp = "mcp_server.main:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "mypy>=2.1",
    "ruff>=0.15",
    # Evals track to the unified "Godot AI" MLflow experiment via the SDK
    # (evals are dev/CI tooling, not shipped server deps). Server matches 3.14.0.
    "mlflow>=3.14",
    # The shared MLflow instance uses an S3 artifact store; boto3 (+ AWS creds
    # in the environment) is needed to upload run artifacts.
    "boto3>=1.43",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# FastMCP 4.0 beta pinning: fastmcp is a thin wrapper over fastmcp-slim at the
# same version. uv won't infer the slim prerelease from the wrapper prerelease,
# so constrain it alongside (per the upgrade guide). The rest of the graph
# stays on stable releases. Add fastmcp-tasks==4.0.0b1 here if #315 adopts tasks.
[tool.uv]
constraint-dependencies = ["fastmcp-slim==4.0.0b1"]

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]

[tool.pytest.ini_options]
# Contract -> Integration -> Unit (see .claude/rules/testing.md).
testpaths = ["tests"]
asyncio_mode = "auto"
# Forbidden skips are a blocking gate; surface them loudly.
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["mcp_server", "tests"]

# pypng (PNG decode for screenshot diffing, issue #37) ships no type stubs.
[[tool.mypy.overrides]]
module = ["png"]
ignore_missing_imports = true
