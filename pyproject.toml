[project]
name = "godot-editor-mcp"
version = "2026.09.02"
description = "MCP server that drives a live Godot editor for AI-driven game development"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "John Doh", email = "johnd@johndstudios.net" }]
keywords = ["godot", "mcp", "ai", "game-development", "model-context-protocol", "editor-automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    # The MCP framework (PrefectHQ/fastmcp). FastMCP 4 stable (issue #403) — GA
    # is built on MCP SDK v2 and the 2026-07-28 sessionless protocol revision
    # (migration plan: docs/mcp-2026-07-28-migration.md). b3 carried the guard
    # pattern (InputRequiredResult / request_state) and tool-title defaults our
    # surface relies on; stable adds the beta-period correctness work (task
    # snapshots, response caching, auth hardening) with breaking changes we
    # already migrated ahead of: no ctx.elicit (guard pattern since #346), no
    # session state (#364), canonical imports.
    "fastmcp[tasks]==4.0.1",
    # WebSocket transport for the addon/server bridge (issue #3).
    "websockets>=16.0",
    # Domain models and typed tool I/O (issue #7).
    "pydantic>=2.13",
    "pypng>=0.20",
    # URL download for asset import (issue #108) + approval-webhook POST (issue #153).
    # httpx2 is a drop-in fork of httpx with the same public API; FastMCP 4.0 uses it
    # exclusively, and standardizing here keeps our httpx exception handlers live code
    # (FastMCP raises httpx2 exceptions, so `except httpx.` would silently never match).
    "httpx2>=2.9",
]

[project.urls]
Homepage = "https://github.com/hybridindie/godot-mcp"
Repository = "https://github.com/hybridindie/godot-mcp"
Documentation = "https://github.com/hybridindie/godot-mcp#readme"
Issues = "https://github.com/hybridindie/godot-mcp/issues"
Changelog = "https://github.com/hybridindie/godot-mcp/releases"

[project.scripts]
godot-editor-mcp = "mcp_server.main:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "mypy>=2.1",
    "ruff>=0.15",
    "jsonschema>=4.26.0",
    "types-jsonschema>=4.26.0.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# FastMCP 4 stable pinning (issue #403): fastmcp is a thin wrapper over
# fastmcp-slim at the same version, and background tasks live in fastmcp-tasks.
# All three ride the same 4.0.1 stable release now, so the constraint block is
# belt-and-suspenders rather than a prerelease-resolution workaround (its
# original purpose at the b3 pin, issue #311) — kept so the slim/tasks pins can
# never drift below the wrapper pin.
[tool.uv]
constraint-dependencies = ["fastmcp-slim==4.0.1", "fastmcp-tasks==4.0.1"]

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]

[tool.pytest.ini_options]
# Contract -> Integration -> Unit (see .claude/rules/testing.md).
testpaths = ["tests"]
asyncio_mode = "auto"
# Forbidden skips are a blocking gate; surface them loudly.
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["mcp_server", "tests"]

# pypng (PNG decode for screenshot diffing, issue #37) ships no type stubs.
[[tool.mypy.overrides]]
module = ["png"]
ignore_missing_imports = true
